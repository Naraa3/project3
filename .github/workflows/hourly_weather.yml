name: Hourly Weather ETL

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-weather-etl:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas sqlalchemy pg8000 requests psycopg2-binary python-dotenv

      - name: Extract weather data
        timeout-minutes: 15
        run: |
          python -u etl/weather/extract_weather.py

      - name: Transform weather data
        run: |
          python -u etl/weather/transform_weather.py

      - name: Load weather data to Neon
        run: |
          python -u etl/weather/load_weather_to_neon.py
